name: Construire l'APK Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v5
        with:
          name: golf7-trajets-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Lien de téléchargement direct pour le téléphone :
      # https://github.com/<compte>/<dépôt>/releases/latest/download/golf7-trajets.apk
      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk golf7-trajets.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk golf7-trajets.apk --title "Golf 7 Trajets (dernière version)" --notes "APK construit automatiquement à partir de ${GITHUB_SHA::7}." --latest
